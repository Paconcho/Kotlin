<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Usuario</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container">
    <div class="form-box">
        <div id="mensaje" class="mensaje"></div>

        <form id="form-login">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-pass" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
            <p>¿No tienes cuenta? <a href="#" class="toggle-form" data-target="form-registro">Regístrate</a></p>
            <p><a href="#" class="toggle-form" data-target="form-recuperar">Olvidé mi contraseña</a></p>
        </form>

        <form id="form-registro" style="display:none;">
            <h2>Registro</h2>
            <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
            <input type="email" id="reg-email" placeholder="Email" required>
            <input type="password" id="reg-pass" placeholder="Contraseña" required>
            <button type="submit">Crear Cuenta</button>
            <p>¿Ya tienes cuenta? <a href="#" class="toggle-form" data-target="form-login">Inicia Sesión</a></p>
        </form>

        <form id="form-recuperar" style="display:none;">
            <h2>Recuperar Contraseña</h2>
            <p>Introduce tu email para enviarte las instrucciones.</p>
            <input type="email" id="rec-email" placeholder="Email" required>
            <button type="submit">Enviar Email</button>
            <p><a href="#" class="toggle-form" data-target="form-login">Volver al Login</a></p>
        </form>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
